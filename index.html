<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Math DIY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0e1a;
    --panel:#161f3d;
    --panel-line:#2a3660;
    --tile:#1c2748;
    --tile-border:#3a4a80;
    --tile-inactive:#10162a;
    --tile-inactive-border:#1c2440;
    --amber:#ffb020;
    --cyan:#4fd8eb;
    --green:#3ee08a;
    --red:#ff5c6c;
    --purple:#b98cf0;
    --pink:#ff6fb0;
    --ink:#e8edf5;
    --ink-dim:#8894b8;
    --font-display:'Orbitron', sans-serif;
    --font-mono:'Space Mono', monospace;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh;
    background:radial-gradient(ellipse at 50% -10%, #1a2550 0%, var(--bg-0) 55%), var(--bg-0);
    color:var(--ink); font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center;
    padding:16px; overflow-x:hidden;
  }
  .app{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:12px; }

  .level-tag{
    text-align:center; font-family:var(--font-display); font-weight:900; font-size:16px;
    letter-spacing:3px; padding:4px 4px 2px;
    background:linear-gradient(90deg, var(--amber), var(--pink), var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 18px rgba(255,176,32,0.25);
    animation:levelGlow 2.2s ease-in-out infinite alternate;
  }
  @keyframes levelGlow{ from{ filter:brightness(1); } to{ filter:brightness(1.4); } }

  .game-area{ position:relative; display:flex; flex-direction:column; gap:12px; }

  /* ---- fixed 4x6 tile grid (4 columns, 6 rows = 24 tiles) ---- */
  .tray-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:6px;
    padding:10px; background:var(--panel); border:1px solid var(--panel-line); border-radius:16px;
  }
  .tile{
    aspect-ratio:1/0.62; border-radius:10px;
    background:linear-gradient(180deg, var(--tile), #17203d); border:1px solid var(--tile-border);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:700; font-size:18px; color:var(--amber);
    cursor:pointer; box-shadow:0 3px 0 #0c1226, 0 4px 10px rgba(0,0,0,0.4);
    transition:transform 0.08s, opacity 0.15s;
  }
  .tile.op{color:var(--cyan);}
  .tile:active{transform:translateY(2px); box-shadow:0 1px 0 #0c1226;}
  .tile.used{opacity:0; pointer-events:none; transform:scale(0.7);}
  .tile.inactive{
    background:var(--tile-inactive); border:1px dashed var(--tile-inactive-border);
    box-shadow:none; cursor:default; pointer-events:none;
    color:var(--ink-dim); opacity:0.5; font-weight:600;
  }

  /* ---- bottom equation builder ---- */
  .display-panel{
    background:linear-gradient(180deg, #0d1428, #0a0f22);
    border:1px solid var(--panel-line); border-radius:16px; padding:18px 12px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.35);
    transition: box-shadow 0.25s, border-color 0.25s;
  }
  .display-panel.correct{ border-color:var(--green); box-shadow: inset 0 0 30px rgba(62,224,138,0.15), 0 0 24px rgba(62,224,138,0.35); }
  .display-panel.wrong{ border-color:var(--red); box-shadow: inset 0 0 30px rgba(255,92,108,0.15), 0 0 24px rgba(255,92,108,0.35); animation: shake 0.35s; }
  @keyframes shake{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);} }

  .slots-row{ display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }
  .slot{
    width:50px; height:58px; border-radius:11px; border:2px dashed var(--panel-line);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:21px; font-weight:700; color:var(--amber);
    background:rgba(255,255,255,0.02); cursor:pointer; transition:border-color 0.15s, transform 0.1s;
    flex-shrink:0;
  }
  .slot.filled{ border-style:solid; border-color:var(--tile-border); background:var(--tile); }
  .slot.op{color:var(--cyan);}
  .slot:active{transform:scale(0.94);}

  .target-stamp{
    display:flex; align-items:center; gap:6px; height:58px; padding:0 10px; border-radius:11px;
    background:rgba(185,140,240,0.08); border:1px solid var(--purple);
    font-family:var(--font-display); font-weight:900; font-size:19px; flex-shrink:0;
  }
  .target-stamp .eq{ color:var(--ink-dim); }
  .target-stamp .tgt{ color:var(--purple); }

  .eq-inline{
    display:flex; align-items:center; height:58px; padding:0 2px;
    font-family:var(--font-display); font-weight:900; font-size:22px; color:var(--ink-dim);
    flex-shrink:0;
  }

  .status-msg{ text-align:center; margin-top:14px; font-family:var(--font-mono); font-size:14px; letter-spacing:0.5px; color:var(--ink-dim); min-height:18px; transition:transform 0.2s; }
  .status-msg.correct{color:var(--green); transform:scale(1.06); font-weight:700;}
  .status-msg.wrong{color:var(--red);}

  .overlay{ position:fixed; inset:0; background:rgba(6,9,20,0.92); display:none; align-items:center; justify-content:center; z-index:10; padding:20px; }
  .overlay.show{display:flex;}
  .overlay-card{ background:var(--panel); border:1px solid var(--panel-line); border-radius:18px; padding:28px 24px; text-align:center; max-width:360px; width:100%; }
  .overlay-card h2{ font-family:var(--font-display); color:var(--amber); margin:0 0 4px; font-size:19px; letter-spacing:1px; }
  .overlay-card p{color:var(--ink-dim); font-size:12.5px; margin:0 0 18px; line-height:1.6;}
  .overlay-actions{ display:flex; flex-direction:column; gap:10px; }

  .btn{
    padding:13px 10px; border-radius:12px; border:1px solid var(--panel-line);
    background:var(--panel); color:var(--ink); font-family:var(--font-body); font-weight:600;
    font-size:13px; cursor:pointer; text-align:center;
  }
  .btn:active{opacity:0.7;}
  .btn.primary{ background:linear-gradient(180deg, var(--amber), #d98f10); border-color:transparent; color:#231400; }

  /* ---- BIG WIN CELEBRATION — pops up in place, over the tiles, same screen ---- */
  .win-overlay{
    position:absolute; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .win-overlay.show{display:flex;}
  .confetti-field{ position:absolute; inset:0; pointer-events:none; }
  .confetti-piece{
    position:absolute; opacity:0.95; will-change:transform, opacity;
    animation:confettiFall linear forwards;
  }
  .confetti-piece.emoji{ font-size:20px; line-height:1; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg) scale(0.5); opacity:0; }
    10%{ opacity:1; transform:translateY(-22px) rotate(70deg) scale(1.1); }
    100%{ transform:translateY(260px) rotate(760deg) scale(0.9); opacity:0; }
  }
  .burst-ring{
    position:absolute; width:60px; height:60px; border-radius:50%;
    border:3px solid var(--amber); opacity:0.9;
    animation:burstOut 0.7s ease-out forwards;
  }
  @keyframes burstOut{ 0%{ transform:scale(0.3); opacity:0.9; } 100%{ transform:scale(6); opacity:0; } }
  .win-card{
    position:relative; text-align:center; animation:popIn 0.45s cubic-bezier(.34,1.56,.64,1);
    background:rgba(10,14,26,0.8); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    border:1px solid rgba(255,176,32,0.4); border-radius:22px; padding:22px 28px;
    box-shadow:0 10px 50px rgba(0,0,0,0.55), 0 0 60px rgba(255,176,32,0.15);
  }
  @keyframes popIn{ 0%{transform:scale(0.15) rotate(-10deg); opacity:0;} 55%{transform:scale(1.25) rotate(3deg); opacity:1;} 75%{transform:scale(0.95) rotate(-1deg);} 100%{transform:scale(1) rotate(0deg);} }
  .win-ribbons{
    font-size:38px; letter-spacing:10px; margin-bottom:4px;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    animation:ribbonWiggle 0.6s ease-in-out infinite alternate;
  }
  @keyframes ribbonWiggle{ from{ transform:rotate(-6deg) scale(1); } to{ transform:rotate(6deg) scale(1.08); } }
  .win-title{
    font-family:var(--font-display); font-weight:900; font-size:38px; letter-spacing:1.5px;
    background:linear-gradient(90deg, var(--amber), var(--pink), var(--cyan), var(--green));
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 50px rgba(255,176,32,0.4);
    animation:pulseGlow 0.7s ease-in-out infinite alternate, shimmerMove 1.6s linear infinite;
    white-space:nowrap;
  }
  @keyframes pulseGlow{ from{ filter:brightness(1); } to{ filter:brightness(1.5); } }
  @keyframes shimmerMove{ from{ background-position:0% 50%; } to{ background-position:100% 50%; } }
  .win-sub{ font-family:var(--font-mono); font-size:14px; color:var(--ink); margin-top:9px; letter-spacing:0.5px; }
</style>
</head>
<body>

<div class="app">
  <div class="game-area" id="gameArea">
    <div class="tray-grid" id="tray"></div>

    <div class="display-panel" id="displayPanel">
      <div class="slots-row" id="slotsRow"></div>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <div class="win-overlay" id="winOverlay">
      <div class="confetti-field" id="confettiField"></div>
      <div class="win-card">
        <div class="win-ribbons" id="winRibbons">🎉🎀🎊</div>
        <div class="win-title" id="winTitle">AWESOME!</div>
        <div class="win-sub" id="winSub">Level 1 complete</div>
      </div>
    </div>
  </div>

  <div class="level-tag" id="lvlTag">LEVEL 1</div>
</div>

<div class="overlay show" id="startOverlay">
  <div class="overlay-card">
    <h2>Math DIY</h2>
    <p>Pick tiles to build an equation that makes sense. No timer — take your time. Each level unlocks a few more tiles and gets a bit tougher. Later on, the answer won't be given anymore — you'll need to find it yourself.</p>
    <div class="overlay-actions">
      <div class="btn primary" id="startBtn">Start</div>
    </div>
  </div>
</div>

<script>
(function(){
  const PRAISE = ["AWESOME!", "GREAT JOB!", "BRILLIANT!", "FANTASTIC!", "YOU'RE ON FIRE!", "NICE WORK!", "PERFECT!", "OUTSTANDING!", "WELL DONE!", "MATH WIZARD!", "CRUSHED IT!", "INCREDIBLE!", "GENIUS!", "UNSTOPPABLE!", "BOOM!", "SUPERSTAR!", "LEGENDARY!", "YOU NAILED IT!", "MIND BLOWN!", "PHENOMENAL!", "TOP MARKS!"];
  const RIBBON_SETS = ["🎉🎊🎉","🥳🎇🥳","🏆✨🏆","🎆🎉🎆","🌟🎊🌟","🎉🥳🎉","⭐🎇⭐"];
  const EMOJI_BURST = ["✨","⭐","🎉","🎊","💫","🌟"];
  const CONFETTI_COLORS = ['#ffb020','#4fd8eb','#3ee08a','#ff5c6c','#b98cf0','#ff6fb0'];
  const GRID_CELLS = 24; // fixed 6 columns x 4 rows
  const BEGINNER_END = 20;   // levels 1-20: target is always shown
  const ADVANCED_START = 21; // levels 21+: no given target, player supplies the result tile too

  const state = {
    level: 1,
    puzzle: null,     // {tokens, target, hasFixedTarget, solutionCount, tray(16, some inactive)}
    slots: [],
    trayUsed: [],
    locked: false
  };

  const el = {
    lvlTag: document.getElementById('lvlTag'),
    tray: document.getElementById('tray'),
    displayPanel: document.getElementById('displayPanel'),
    slotsRow: document.getElementById('slotsRow'),
    status: document.getElementById('statusMsg'),
    startOverlay: document.getElementById('startOverlay'),
    startBtn: document.getElementById('startBtn'),
    winOverlay: document.getElementById('winOverlay'),
    winTitle: document.getElementById('winTitle'),
    winRibbons: document.getElementById('winRibbons'),
    winSub: document.getElementById('winSub'),
    confettiField: document.getElementById('confettiField'),
  };

  function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function evalExpr(tokens){
    if(tokens.length===0 || tokens.length%2===0) return null;
    for(let i=0;i<tokens.length;i++){
      const expectNum = i%2===0;
      if(expectNum && (!tokens[i] || tokens[i].type!=='num')) return null;
      if(!expectNum && (!tokens[i] || tokens[i].type!=='op')) return null;
    }
    const vals=[Number(tokens[0].value)];
    const ops=[];
    for(let i=1;i<tokens.length;i+=2){
      const n = Number(tokens[i+1].value);
      if(Number.isNaN(n)) return null;
      ops.push(tokens[i].value);
      vals.push(n);
    }
    const vals2=[vals[0]], ops2=[];
    for(let i=0;i<ops.length;i++){
      const op=ops[i], nextVal=vals[i+1];
      if(op==='×'){ vals2[vals2.length-1]*=nextVal; }
      else if(op==='÷'){
        if(nextVal===0) return null;
        vals2[vals2.length-1] = vals2[vals2.length-1]/nextVal;
      } else { vals2.push(nextVal); ops2.push(op); }
    }
    let result = vals2[0];
    for(let i=0;i<ops2.length;i++){
      result = ops2[i]==='+' ? result+vals2[i+1] : result-vals2[i+1];
    }
    return result;
  }

  // How many of the 16 grid cells are "active" (show a real tile) vs grayed-out placeholders.
  // Starts small (just the solution + 3 extra tiles) and ramps up to the full 4x4 by level 20.
  function getActiveCount(level, solutionCount){
    if(level>=BEGINNER_END) return GRID_CELLS;
    const startActive = solutionCount + 3;
    const t = (level-1)/(BEGINNER_END-1); // 0 at level1, 1 at level20
    return Math.min(GRID_CELLS, Math.round(startActive + t*(GRID_CELLS-startActive)));
  }

  function getLevelConfig(level){
    let hi = 9 + Math.floor((level-1)/2)*3;
    hi = Math.min(hi, 30);
    let ops = ['+','−'];
    if(level>=3) ops.push('×');
    if(level>=6) ops.push('÷');
    const hasFixedTarget = level < ADVANCED_START;
    const solutionCount = hasFixedTarget ? 5 : 6; // 5 = expression only; 6 = expression + self-found result tile
    return { range:[1,hi], ops, hasFixedTarget, solutionCount };
  }

  function generateExpression(cfg){
    const [lo,hi] = cfg.range;
    let tries=0;
    while(tries<800){
      tries++;
      const nums=[rand(lo,hi), rand(lo,hi), rand(lo,hi)];
      const ops=[cfg.ops[rand(0,cfg.ops.length-1)], cfg.ops[rand(0,cfg.ops.length-1)]];
      const tokens=[
        {value:String(nums[0]), type:'num'},
        {value:ops[0], type:'op'},
        {value:String(nums[1]), type:'num'},
        {value:ops[1], type:'op'},
        {value:String(nums[2]), type:'num'},
      ];
      const r = evalExpr(tokens);
      if(r!==null && Number.isInteger(r) && Math.abs(r)<=999){
        return { tokens, target:r };
      }
    }
    const a=rand(lo,hi), b=rand(lo,hi), c=rand(lo,hi);
    const tokens=[
      {value:String(a),type:'num'}, {value:'+',type:'op'},
      {value:String(b),type:'num'}, {value:'+',type:'op'},
      {value:String(c),type:'num'},
    ];
    return { tokens, target:a+b+c };
  }

  function generateDecoy(cfg, existingKeys){
    const [lo,hi] = cfg.range;
    for(let attempt=0; attempt<25; attempt++){
      const asNum = Math.random()<0.6;
      let tile;
      if(asNum){
        tile = {value:String(rand(lo, hi+5)), type:'num'};
      } else {
        tile = {value:cfg.ops[rand(0,cfg.ops.length-1)], type:'op'};
      }
      const key = tile.value+tile.type;
      if(!existingKeys.includes(key)) return tile;
    }
    return {value:String(rand(lo,hi+9)), type:'num'};
  }

  function generatePuzzle(){
    const cfg = getLevelConfig(state.level);
    const { tokens: exprTokens, target } = generateExpression(cfg);

    // solutionTiles = the tiles the player must place. In fixed-target levels that's just
    // the 5 expression tiles; in advanced levels the result tile is included too (6 total),
    // since there's no given answer to check against visually.
    const solutionTiles = cfg.hasFixedTarget ? exprTokens.slice() : exprTokens.concat([{value:String(target), type:'num'}]);

    const activeCount = getActiveCount(state.level, cfg.solutionCount);
    const decoyCount = Math.max(0, activeCount - solutionTiles.length);
    const seen = solutionTiles.map(t=>t.value+t.type);
    const decoys=[];
    for(let i=0;i<decoyCount;i++){
      const d = generateDecoy(cfg, seen.concat(decoys.map(x=>x.value+x.type)));
      decoys.push(d);
      seen.push(d.value+d.type);
    }

    const activeTiles = solutionTiles.concat(decoys).sort(()=>Math.random()-0.5);
    // Pad the rest of the 16 cells with inactive (grayed) placeholders, then shuffle positions.
    const cells = activeTiles.map(t=>({...t, active:true}));
    while(cells.length < GRID_CELLS) cells.push({active:false});
    const tray = cells.sort(()=>Math.random()-0.5);

    return {
      target,
      hasFixedTarget: cfg.hasFixedTarget,
      solutionCount: cfg.solutionCount,
      tray
    };
  }

  function render(){
    el.lvlTag.textContent = 'LEVEL ' + state.level;

    el.tray.innerHTML = '';
    state.puzzle.tray.forEach((t, i)=>{
      const d = document.createElement('div');
      if(!t.active){
        d.className = 'tile inactive';
        d.textContent = '?';
      } else {
        d.className = 'tile' + (t.type==='op' ? ' op' : '') + (state.trayUsed[i] ? ' used' : '');
        d.textContent = t.value;
        d.addEventListener('click', ()=>onTrayTap(i));
      }
      el.tray.appendChild(d);
    });

    el.slotsRow.innerHTML = '';
    const lastIdx = state.slots.length - 1;
    state.slots.forEach((s, i)=>{
      if(!state.puzzle.hasFixedTarget && i === lastIdx){
        const eq = document.createElement('div');
        eq.className = 'eq-inline';
        eq.textContent = '=';
        el.slotsRow.appendChild(eq);
      }
      const d = document.createElement('div');
      d.className = 'slot' + (s ? ' filled' : '') + (s && s.type==='op' ? ' op' : '');
      d.textContent = s ? s.value : '';
      d.addEventListener('click', ()=>onSlotTap(i));
      el.slotsRow.appendChild(d);
    });
    if(state.puzzle.hasFixedTarget){
      const stamp = document.createElement('div');
      stamp.className = 'target-stamp';
      stamp.innerHTML = '<span class="eq">=</span><span class="tgt">'+state.puzzle.target+'</span>';
      el.slotsRow.appendChild(stamp);
    }
  }

  function onTrayTap(i){
    if(state.locked || state.trayUsed[i] || !state.puzzle.tray[i].active) return;
    const emptySlot = state.slots.findIndex(s=>s===null);
    if(emptySlot===-1) return;
    state.slots[emptySlot] = {...state.puzzle.tray[i], trayIndex:i};
    state.trayUsed[i] = true;
    setStatus('', '');
    render();
    if(state.slots.every(s=>s!==null)) checkAnswer();
  }

  function onSlotTap(i){
    if(state.locked || !state.slots[i]) return;
    const trayIndex = state.slots[i].trayIndex;
    state.trayUsed[trayIndex] = false;
    state.slots[i] = null;
    setStatus('', '');
    render();
  }

  function checkAnswer(){
    let valid;
    if(state.puzzle.hasFixedTarget){
      const value = evalExpr(state.slots);
      valid = value!==null && Math.abs(value-state.puzzle.target)<1e-9;
    } else {
      const left = state.slots.slice(0, state.slots.length-1);
      const right = state.slots[state.slots.length-1];
      const lv = evalExpr(left);
      const rv = right ? Number(right.value) : NaN;
      valid = lv!==null && !Number.isNaN(rv) && Math.abs(lv-rv)<1e-9;
    }
    if(valid) onCorrect(); else onWrong();
  }

  function spawnConfetti(container, count){
    container.innerHTML = '';
    const frag = document.createDocumentFragment();
    for(let i=0;i<count;i++){
      const piece = document.createElement('div');
      const roll = Math.random();
      if(roll < 0.22){
        // emoji burst piece
        piece.className = 'confetti-piece emoji';
        piece.textContent = EMOJI_BURST[rand(0,EMOJI_BURST.length-1)];
        piece.style.left = rand(4,96)+'%';
        piece.style.top = rand(2,45)+'%';
        piece.style.fontSize = rand(16,26)+'px';
      } else {
        const isRibbon = roll < 0.55;
        piece.className = 'confetti-piece';
        const color = CONFETTI_COLORS[rand(0,CONFETTI_COLORS.length-1)];
        const size = rand(6,12);
        piece.style.left = rand(4,96)+'%';
        piece.style.top = rand(2,45)+'%';
        piece.style.width = (isRibbon? size*0.5 : size)+'px';
        piece.style.height = (isRibbon? size*2.6 : size)+'px';
        piece.style.background = color;
        piece.style.borderRadius = isRibbon ? '2px' : (Math.random()<0.5 ? '50%' : '2px');
      }
      const duration = (1.0 + Math.random()*1.0).toFixed(2);
      const delay = (Math.random()*0.4).toFixed(2);
      piece.style.animationDuration = duration+'s';
      piece.style.animationDelay = delay+'s';
      frag.appendChild(piece);
    }
    container.appendChild(frag);
  }

  function spawnBurstRings(container, count){
    const frag = document.createDocumentFragment();
    for(let i=0;i<count;i++){
      const ring = document.createElement('div');
      ring.className = 'burst-ring';
      ring.style.left = 'calc(50% - 30px)';
      ring.style.top = 'calc(50% - 30px)';
      ring.style.borderColor = CONFETTI_COLORS[rand(0,CONFETTI_COLORS.length-1)];
      ring.style.animationDelay = (i*0.15)+'s';
      frag.appendChild(ring);
    }
    container.appendChild(frag);
  }

  function showWinCelebration(onDone){
    const praise = PRAISE[rand(0,PRAISE.length-1)];
    const ribbons = RIBBON_SETS[rand(0,RIBBON_SETS.length-1)];
    el.winTitle.textContent = praise;
    el.winRibbons.textContent = ribbons;
    el.winSub.textContent = 'Level ' + state.level + ' complete';
    spawnConfetti(el.confettiField, 70);
    spawnBurstRings(el.confettiField, 3);
    el.winOverlay.classList.add('show');
    setTimeout(()=>{
      el.winOverlay.classList.remove('show');
      el.confettiField.innerHTML = '';
      onDone();
    }, 1900);
  }

  function onCorrect(){
    state.locked = true;
    el.displayPanel.classList.add('correct');
    setStatus('', '');

    showWinCelebration(()=>{
      el.displayPanel.classList.remove('correct');
      state.level++;
      loadPuzzle();
    });
  }

  function onWrong(){
    el.displayPanel.classList.add('wrong');
    setStatus('✗ NOT BALANCED — TRY AGAIN', 'wrong');
    setTimeout(()=>{
      el.displayPanel.classList.remove('wrong');
      state.slots = new Array(state.puzzle.solutionCount).fill(null);
      state.trayUsed = state.puzzle.tray.map(()=>false);
      setStatus('', '');
      render();
    }, 700);
  }

  function setStatus(msg, cls){
    el.status.textContent = msg;
    el.status.className = 'status-msg' + (cls ? ' '+cls : '');
  }

  function loadPuzzle(){
    state.locked = false;
    state.puzzle = generatePuzzle();
    state.slots = new Array(state.puzzle.solutionCount).fill(null);
    state.trayUsed = state.puzzle.tray.map(()=>false);
    setStatus('', '');
    saveProgress();
    render();
  }

  const SAVE_KEY = 'mathDiyProgress';
  function saveProgress(){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify({level: state.level})); }catch(e){}
  }
  function loadSavedLevel(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return 1;
      const data = JSON.parse(raw);
      const lvl = Number(data.level);
      return Number.isInteger(lvl) && lvl>=1 ? lvl : 1;
    }catch(e){ return 1; }
  }

  function startGame(){
    state.level = loadSavedLevel();
    el.startOverlay.classList.remove('show');
    loadPuzzle();
  }

  el.startBtn.addEventListener('click', startGame);

  // Show the saved level on the start screen before the player even taps Start.
  (function initStartScreen(){
    const savedLevel = loadSavedLevel();
    if(savedLevel > 1 && el.startBtn){
      el.startBtn.textContent = 'Continue — Level ' + savedLevel;
    }
  })();
})();
</script>
</body>
</html>
